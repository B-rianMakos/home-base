[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "family-scheduler"
version = "1.12.0"
description = "Home Base: events, tasks and reminders for the family, on the home network."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "cryptography",
    "fastapi",
    "google-api-python-client",
    "google-auth",
    "google-auth-oauthlib",
    "httpx",
    "keyring",
    "PySide6-Essentials",
    "python-dateutil",
    "tzdata",
    "uvicorn",
    "zeroconf",
]

[project.optional-dependencies]
dev = ["mypy", "pyinstaller", "pytest", "ruff", "types-python-dateutil"]

[project.scripts]
family-scheduler-hub = "family_scheduler.hub.__main__:main"

[project.gui-scripts]
family-scheduler = "family_scheduler.app.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
family_scheduler = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["family_scheduler"]

[[tool.mypy.overrides]]
module = ["googleapiclient.*", "google_auth_oauthlib.*", "google.oauth2.*", "google.auth.*", "keyring.*", "zeroconf.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["family_scheduler.app.*"]
disallow_untyped_calls = false

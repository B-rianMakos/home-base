; Home Base settings: an example with placeholder values (WO-FS-015 RN-4).
;
; The real file is config.ini in the hub's data folder (C:\ProgramData\FamilyScheduler\config.ini, or FS_DATA_DIR).
; The installer writes it; when running from source you can copy this file there. Never commit your own config.ini.

[setup]
; This PC's role: "hub" (holds the family's data and runs the hub at start-up) or "client" (a family PC that uses the
; home hub). Without the file, a PC is a client.
role = client

; Everything else is entered in the app, on the hub PC, under Family & Settings, and kept in the hub's own database
; (secrets encrypted, sealed to that PC). None of it belongs in a file:
;
;   Family members ........... your family's own addresses, e.g. you@example.com
;   Admin calendar account ... your family's Gmail address, e.g. name@gmail.com (sends invites and the digest)
;   Second calendar account .. optional, e.g. new@gmail.com
;   Google client file ....... the client_secret.json you download from your own free Google Cloud project
;                              (README: Google setup). Choose it in Family & Settings; it's stored encrypted.
;   Gmail app password ....... 16 letters from https://myaccount.google.com/apppasswords (README: Setting up the
;                              digest email). Entered in Family & Settings; it's stored encrypted.
;   Cars ..................... e.g. Blue hatchback, Grey minivan
;
; Environment settings, for a test or demo hub (not in this file):
;
;   FS_DATA_DIR = %TEMP%\home-base-test   a separate data folder, away from the real hub's
;   FS_PORT     = 8766                    the hub's port (default 8765)
;   FS_HUB      = 127.0.0.1:8766          the hub the app connects to (default: found on the network)
;   FS_CALENDAR = fake                    test mode: events stay on the hub, nobody is invited
;   FS_MAIL     = fake                    test mode: digests are recorded, not sent
;   FS_BLOCKLIST = path\to\my-list.txt    your private list for tools\check_public.py (default
;                                         %USERPROFILE%\.family-scheduler-blocklist.txt)
